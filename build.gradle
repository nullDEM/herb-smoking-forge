plugins {
    id "java"
    id "net.neoforged.moddev.legacyforge" version "2.0.91"
}

group = "pl.daniel.herbsmoking"
version = "1.0.0"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "1.20.1-47.2.0"

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.minecraftforge.net" }
}

jar {
    manifest.attributes(
        "Mod-Name": "Herb Smoking Mod",
        "Mod-ID": "herbsmoking",
        "Mod-Version": project.version,
        "Mod-Author": "Daniel",
        "Mod-Description": "Trzy odmiany ziół, sadzonki, bongo, fajki - wersja Forge 1.20.1"
    )
}